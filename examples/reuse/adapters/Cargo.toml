[package]
name = "reuse-adapters"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]
resolver = "3"

[dependencies]
aap-engine = { path = "../../../crates/aap-engine" }
aap-observe = { path = "../../../crates/aap-observe" }
aap-transport = { path = "../../../crates/aap-transport" }
aap-types = { path = "../../../crates/aap-types" }
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }

[dev-dependencies]
aap-policy = { path = "../../../crates/aap-policy" }
aap-providers = { path = "../../../crates/aap-providers" }
aap-secrets = { path = "../../../crates/aap-secrets" }
aap-test-support = { path = "../../../crates/aap-test-support" }
base64 = "0.22"
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
