name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target-agent-auth-proxy-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
  msrv:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target-agent-auth-proxy-msrv-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --all-targets --locked
  reuse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.95.0", "1.88.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_TARGET_DIR: /tmp/cargo-target-aap-reuse-${{ github.run_id }}-${{ matrix.toolchain }}
      AAP_DAEMON: /tmp/cargo-target-aap-reuse-${{ github.run_id }}-${{ matrix.toolchain }}/daemon/debug/agent-auth-proxy
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --component clippy
      - name: Build the actual daemon
        run: CARGO_TARGET_DIR="$CARGO_TARGET_DIR/daemon" cargo build -p aap-daemon --bin agent-auth-proxy --locked
      - name: Check independent workspace and dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          for consumer in client embedded adapters; do
            manifest="examples/reuse/$consumer/Cargo.toml"
            test "$(cargo locate-project --manifest-path "$manifest" --workspace --message-format plain)" = "$GITHUB_WORKSPACE/$manifest"
            dependencies=$(cargo tree --manifest-path "$manifest" --locked --edges normal,build --prefix none)
            if test "$consumer" = client; then
              forbidden='^(aap-(engine|auth|secrets|config|policy|observe|providers|transport|daemon|mcp(-upstream)?|store-[^ ]+|test-support)|rusqlite|libsqlite3-sys|security-framework(-sys)?|rustls) '
            elif test "$consumer" = adapters; then
              forbidden='^(aap-(daemon|test-support|store-[^ ]+)|rusqlite|libsqlite3-sys|security-framework(-sys)?) '
            else
              forbidden='^(aap-daemon|aap-test-support) '
            fi
            if printf '%s\n' "$dependencies" | grep -E "$forbidden"; then
              exit 1
            fi
            if test "$consumer" = adapters; then
              dependencies=$(cargo tree --manifest-path "$manifest" --locked --edges normal,build,dev --prefix none)
              if printf '%s\n' "$dependencies" | grep -E '^(aap-store-[^ ]+|rusqlite|libsqlite3-sys|security-framework(-sys)?) '; then
                exit 1
              fi
            fi
          done
      - name: Build normal consumers without test features
        run: |
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/client" cargo build --manifest-path examples/reuse/client/Cargo.toml --locked --bin reuse-client
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/embedded" cargo build --manifest-path examples/reuse/embedded/Cargo.toml --locked --lib
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/adapters" cargo build --manifest-path examples/reuse/adapters/Cargo.toml --locked --lib
      - name: Run independent conformance tests
        run: |
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/client" cargo test --manifest-path examples/reuse/client/Cargo.toml --locked
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/embedded" cargo test --manifest-path examples/reuse/embedded/Cargo.toml --locked
          CARGO_TARGET_DIR="$CARGO_TARGET_DIR/adapters" cargo test --manifest-path examples/reuse/adapters/Cargo.toml --locked
      - name: Format, lint, and document consumers
        if: matrix.toolchain == '1.95.0'
        run: |
          rustfmt --edition 2024 --check examples/reuse/support/scenarios.rs examples/reuse/support/fixture.rs
          for consumer in client embedded adapters; do
            manifest="examples/reuse/$consumer/Cargo.toml"
            cargo fmt --manifest-path "$manifest" --all -- --check
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR/$consumer" cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR/$consumer" RUSTDOCFLAGS=-Dwarnings cargo doc --manifest-path "$manifest" --no-deps --locked
          done
