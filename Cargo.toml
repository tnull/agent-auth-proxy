[workspace]
resolver = "3"
members = [
    "crates/aap-types",
    "crates/aap-policy",
    "crates/aap-secrets",
    "crates/aap-config",
    "crates/aap-store-sqlite",
    "crates/aap-transport",
    "crates/aap-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
aap-types = { path = "crates/aap-types" }
aap-policy = { path = "crates/aap-policy" }
aap-secrets = { path = "crates/aap-secrets" }
aap-config = { path = "crates/aap-config" }
aap-store-sqlite = { path = "crates/aap-store-sqlite" }
aap-transport = { path = "crates/aap-transport" }
aap-test-support = { path = "crates/aap-test-support" }
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
http = "1"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
rustix = { version = "1", features = ["fs", "process"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled-sqlcipher"] }
tokio = { version = "1", default-features = false }
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
