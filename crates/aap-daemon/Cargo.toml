[package]
name = "aap-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "agent-auth-proxy"
path = "src/main.rs"

[dependencies]
aap-types.workspace = true
aap-config.workspace = true
aap-policy.workspace = true
aap-secrets.workspace = true
aap-engine.workspace = true
aap-providers.workspace = true
aap-observe.workspace = true
aap-transport.workspace = true
aap-http.workspace = true
base64.workspace = true
http.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rustix.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
aap-store-sqlite.workspace = true

[dev-dependencies]
aap-client.workspace = true
aap-test-support.workspace = true
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }

[lints]
workspace = true
